name: Release & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # semantic-release: push the version commit + tag, create the Release
  issues: write
  pull-requests: write
  pages: write # deploy to GitHub Pages
  id-token: write # Pages deployment via OIDC

# One release/deploy at a time; never cancel an in-progress one.
concurrency:
  group: release-deploy
  cancel-in-progress: false

jobs:
  release:
    name: Release & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so semantic-release can determine the version.
          fetch-depth: 0
          # Let semantic-release authenticate with GITHUB_TOKEN itself.
          persist-credentials: false

      # Uses the pnpm version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Don't release or deploy on broken code.
      - name: Test
        run: pnpm test

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

      # Build AFTER semantic-release so the bundle embeds the just-bumped
      # version (see the __APP_VERSION__ define in vite.config.ts). When no
      # release is cut, this simply deploys the current content unchanged.
      - name: Build
        run: pnpm exec vite build

      - uses: actions/configure-pages@v5
        with:
          # Enable GitHub Pages (Actions source) via the API on first run.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
